name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Sync the real connectors (offline dry run)
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" sync --config examples/connectors.yaml --dry-run \
            --from 2026-10-19T00:00:00Z --to 2026-10-20T00:00:00Z

      - name: Prove the determinism contract
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" demo --log .chronotone/demo.jsonl --seed 42
          java -jar "$JAR" render --log .chronotone/demo.jsonl --out out/a --seed 42
          java -jar "$JAR" render --log .chronotone/demo.jsonl --out out/b --seed 42
          java -jar "$JAR" verify --log .chronotone/demo.jsonl
          # The manifest carries no wall-clock fields, so byte-identical output is the assertion.
          diff out/a/chronotone.json out/b/chronotone.json

      - name: Prove the commitment round-trip
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" commit --log .chronotone/demo.jsonl --out out/commitment.json
          java -jar "$JAR" commit --log .chronotone/demo.jsonl --out out/commitment2.json
          diff out/commitment.json out/commitment2.json          # commitments are deterministic too
          java -jar "$JAR" prove --commitment out/commitment.json --index 4 --out out/proof.json
          java -jar "$JAR" verify --log .chronotone/demo.jsonl --commitment out/commitment.json

          # check must pass with only the two published files: no log, no config, no events.
          mkdir -p /tmp/verifier-only
          cp out/commitment.json out/proof.json /tmp/verifier-only/
          cd /tmp/verifier-only
          java -jar "$JAR_ABS" check --commitment commitment.json --proof proof.json

          # ...and a forged proof must be rejected, with a non-zero exit code.
          sed 's/"index":4/"index":5/' proof.json > forged.json
          if java -jar "$JAR_ABS" check --commitment commitment.json --proof forged.json; then
            echo "a forged proof was accepted"; exit 1
          fi
        env:
          JAR_ABS: ${{ github.workspace }}/chronotone-cli/target/chronotone-cli-0.1.0-SNAPSHOT.jar

      - name: Upload the rendered day
        uses: actions/upload-artifact@v4
        with:
          name: chronotone-demo
          path: out/a
