name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Sync the real connectors (offline dry run)
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" sync --config examples/connectors.yaml --dry-run \
            --from 2026-10-19T00:00:00Z --to 2026-10-20T00:00:00Z

      - name: Prove the determinism contract
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" demo --log .chronotone/demo.jsonl --seed 42
          java -jar "$JAR" render --log .chronotone/demo.jsonl --out out/a --seed 42
          java -jar "$JAR" render --log .chronotone/demo.jsonl --out out/b --seed 42
          java -jar "$JAR" verify --log .chronotone/demo.jsonl
          # The manifest carries no wall-clock fields, so byte-identical output is the assertion.
          diff out/a/chronotone.json out/b/chronotone.json

      - name: Prove the commitment round-trip
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" commit --log .chronotone/demo.jsonl --out out/commitment.json
          java -jar "$JAR" commit --log .chronotone/demo.jsonl --out out/commitment2.json
          diff out/commitment.json out/commitment2.json          # commitments are deterministic too
          java -jar "$JAR" prove --commitment out/commitment.json --index 4 --out out/proof.json
          java -jar "$JAR" verify --log .chronotone/demo.jsonl --commitment out/commitment.json

          # check must pass with only the two published files: no log, no config, no events.
          mkdir -p /tmp/verifier-only
          cp out/commitment.json out/proof.json /tmp/verifier-only/
          cd /tmp/verifier-only
          java -jar "$JAR_ABS" check --commitment commitment.json --proof proof.json

          # ...and a forged proof must be rejected, with a non-zero exit code.
          sed 's/"index":4/"index":5/' proof.json > forged.json
          if java -jar "$JAR_ABS" check --commitment commitment.json --proof forged.json; then
            echo "a forged proof was accepted"; exit 1
          fi
        env:
          JAR_ABS: ${{ github.workspace }}/chronotone-cli/target/chronotone-cli-0.1.0-SNAPSHOT.jar

      - name: Prove the station round-trip
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          # A fixed day so the window below is the same on every run.
          java -jar "$JAR" demo --log .chronotone/station-day.jsonl --day 2026-10-19 --seed 42

          # 1. A live frame must be byte-identical to a batch render of the same window.
          java -jar "$JAR" station --log .chronotone/station-day.jsonl --window 30m \
            --now 2026-10-19T13:00:00Z --seed 42 --out out/station
          java -jar "$JAR" render --log .chronotone/station-day.jsonl --day 2026-10-19 \
            --from 12:30 --minutes 30 --seed 42 --out out/station-ref >/dev/null
          cmp out/station/chronotone.wav out/station-ref/chronotone.wav

          # 2. Pinning --now makes the whole frame a pure function again.
          java -jar "$JAR" station --log .chronotone/station-day.jsonl --window 30m \
            --now 2026-10-19T13:00:00Z --seed 42 --out out/station2
          diff out/station/station.json out/station2/station.json

          # 3. Following the clock: three ticks one minute apart stream three closed slots.
          java -jar "$JAR" station --log .chronotone/station-day.jsonl --window 30m \
            --now 2026-10-19T13:00:00Z --seed 42 --out out/follow \
            --follow --every 60s --ticks 3 --stream > out/stream.pcm 2> out/follow.log
          grep -c "streamed 1 slot(s)" out/follow.log | grep -qx 3

          # 4. ...and the last streamed block is the archival audio of that slot, byte for byte.
          python3 - <<'PY'
          import json
          manifest = json.load(open("out/follow/station.json"))
          bounds = manifest["slot_samples"]
          slots = manifest["slots"]
          with open("out/stream.pcm", "rb") as handle:
              stream = handle.read()
          with open("out/follow/chronotone.wav", "rb") as handle:
              wav = handle.read()
          chunk = (bounds[slots] - bounds[slots - 1]) * 2
          streamed_last = stream[-chunk:]
          archived = wav[44 + bounds[slots - 1] * 2 : 44 + bounds[slots] * 2]
          assert len(stream) % 2 == 0 and len(stream) > 0, "stream is not 16-bit PCM"
          assert streamed_last == archived, "the streamed slot is not the archived audio"
          assert b"\x00" * 64 not in streamed_last, "the streamed slot looks silent"
          PY

      - name: Prove the album masters a month as one thing
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" demo --log .chronotone/album-month.jsonl --day 2026-10-19 --seed 42

          # Two days requested, one with no entries: the empty day is recorded, not rendered.
          java -jar "$JAR" album --log .chronotone/album-month.jsonl \
            --from 2026-10-19 --days 2 --start 07:00 --window 30m \
            --seed 42 --out out/album-a --stems
          java -jar "$JAR" album --log .chronotone/album-month.jsonl \
            --from 2026-10-19 --days 2 --start 07:00 --window 30m \
            --seed 42 --out out/album-b --stems

          # Same inputs, same tracks: no wall clock, no machine state in the manifest.
          cmp out/album-a/album.json out/album-b/album.json
          cmp out/album-a/tracks/2026-10-19.wav out/album-b/tracks/2026-10-19.wav

          python3 - <<'PY'
          import json, struct, wave

          manifest = json.load(open("out/album-a/album.json"))
          assert manifest["format"] == "chronotone.album/1"
          assert [t["day"] for t in manifest["tracks"]] == ["2026-10-19"]
          assert manifest["empty_days"] == ["2026-10-20"]
          assert manifest["mastered"] == "album"

          def pcm(path):
              with wave.open(path, "rb") as w:
                  return struct.unpack("<%dh" % w.getnframes(), w.readframes(w.getnframes()))

          track = pcm("out/album-a/tracks/2026-10-19.wav")
          stems = [pcm("out/album-a/stems/2026-10-19/%s.wav" % name)
                   for name in ("pad", "bass", "lead", "kick", "hat")]

          # One gain for the album: the loudest sample of the loudest day is the album peak.
          assert max(abs(s) for s in track) == round(0.89 * 32767)
          # Stems are the same audio split by voice: they add back up to the track.
          worst = max(abs(sum(v) - t) for t, *v in zip(track, *stems))
          assert worst <= len(stems), worst
          PY

      - name: Prove the cover is a function of the manifest
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)
          java -jar "$JAR" cover --album out/album-a --out out/album-a/art
          java -jar "$JAR" cover --album out/album-a --out out/album-a/art2

          # Same manifest, same pixels: the writer emits stored deflate, not zlib's output.
          cmp out/album-a/art/cover.png out/album-a/art2/cover.png
          cmp out/album-a/art/share.png out/album-a/art2/share.png
          cmp out/album-a/art/art.json out/album-a/art2/art.json

          python3 - <<'PY'
          import json, struct

          art = json.load(open("out/album-a/art/art.json"))
          assert art["format"] == "chronotone.art/1"
          assert art["album_fingerprint"] == json.load(open("out/album-a/album.json"))["fingerprint"]
          for entry in ("cover", "share"):
              data = open("out/album-a/art/%s.png" % entry, "rb").read()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              width, height, depth, colour = struct.unpack(">IIBB", data[16:26])
              assert (width, height) == (art[entry]["width"], art[entry]["height"])
              assert depth == 4 and colour == 3, "not an indexed 4-bit PNG"
              assert len(data) > 1000
          assert open("out/album-a/art/cover.png", "rb").read() != \
                 open("out/album-a/art/share.png", "rb").read()
          PY

      - name: Build and test the player
        working-directory: player
        run: ./gradlew --no-daemon :shared:jvmTest :desktopApp:test :androidApp:assembleDebug

      - name: Prove the player agrees with the engine
        run: |
          JAR=$(ls chronotone-cli/target/chronotone-cli-*.jar | grep -v original | head -n1)

          # Regenerate the exact frame the player's fixture came from. The engine is deterministic,
          # so this is a byte-for-byte diff, not a "close enough" comparison.
          java -jar "$JAR" demo --log .chronotone/station-day.jsonl --day 2026-10-19 --seed 42
          java -jar "$JAR" station --log .chronotone/station-day.jsonl --window 30m \
            --now 2026-10-19T22:14:00Z --seed 42 --out out/fixture-check
          diff -u player/shared/src/jvmTest/resources/station.json out/fixture-check/station.json

      - name: Upload the rendered day
        uses: actions/upload-artifact@v4
        with:
          name: chronotone-demo
          path: out/a
